spring:
  application:
    name: fitlog-server
  config:
    import:
      - optional:file:./local-secrets.properties
      - optional:file:./server/local-secrets.properties
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:fitlog}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${db.username:root}
    password: ${db.password:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

webpush:
  vapid:
    public-key: ${WEBPUSH_VAPID_PUBLIC_KEY:}
    private-key: ${WEBPUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEBPUSH_VAPID_SUBJECT:mailto:admin@example.com}
  scheduler:
    enabled: ${WEBPUSH_SCHEDULER_ENABLED:true}
    fixed-delay-ms: ${WEBPUSH_SCHEDULER_FIXED_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: FitLog backend server
    java-version: ${java.version}

app:
  # 공공데이터포털 식품영양성분 DB — https://www.data.go.kr/data/15127578/openapi.do
  # 활용 페이지 Swagger의 엔드포인트명이 다를 경우 inquiry-operation 등을 수정하세요.
  data-gov-food-nutrition:
    service-key: ${DATAGOV_SERVICE_KEY:}
    base-url:
    inquiry-operation:
    import-http-enabled: ${FOOD_IMPORT_HTTP_ENABLED:false}
    import-secret: ${FOOD_IMPORT_SECRET:}
    page-size: ${FOOD_IMPORT_PAGE_SIZE:100}
    pause-ms-between-requests: ${FOOD_IMPORT_PAUSE_MS:100}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:fitlog-local-dev-secret}
    token-validity-hours: ${AUTH_TOKEN_VALIDITY_HOURS:168}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  cors:
    allowed-origins:
      - ${web.origin:http://localhost:3000}
      - http://127.0.0.1:3000
      - http://localhost:3001
      - http://127.0.0.1:3001
