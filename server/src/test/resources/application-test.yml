spring:
  datasource:
    url: jdbc:h2:mem:fitlog-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  upload:
    profile-images:
      storage-path: build/test-profile-images
      public-path: /uploads/profile-images
      max-bytes: 5242880
  oauth:
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
      redirect-uri: http://localhost:3000/auth/kakao/callback
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
      redirect-uri: http://localhost:3000/auth/google/callback
  cors:
    allowed-origins:
      - http://localhost:3000

webpush:
  vapid:
    public-key: test-vapid-public-key
    private-key: test-vapid-private-key
    subject: mailto:test@example.com
  scheduler:
    enabled: false
